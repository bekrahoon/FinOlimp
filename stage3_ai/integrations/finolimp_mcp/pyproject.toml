[project]
name = "finolimp-mcp"
version = "0.1.0"
description = "OpenCode tools for the deterministic FinOlimp reconciliation workflow"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["finolimp_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
